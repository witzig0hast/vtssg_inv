# VTSSG Inventar – Docker-Stack
# Alle Container/Netze/Volumes tragen das Präfix "vtssg_inv02_".
# (Docker erlaubt keine führenden Unterstriche in Ressourcennamen – daher ohne "_" am Anfang.)
name: vtssg_inv02

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging: *logging

x-app: &app
  <<: *hardening
  image: vtssg_inv02_app:${APP_VERSION:-latest}
  build: { context: ., target: app }
  env_file: .env.docker
  environment: &app-env
    APP_KEY_FILE: /run/secrets/app_key
    DB_PASSWORD_FILE: /run/secrets/db_password
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    ADMIN_PASSWORD_FILE: /run/secrets/admin_password
  secrets: [app_key, db_password, redis_password, admin_password]
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid
    - /var/www/html/bootstrap/cache:size=16m,uid=82,gid=82,mode=0750
  volumes:
    - storage:/var/www/html/storage
  networks: [backend, frontend]

services:
  # ── Datenbank ──────────────────────────────────────────────────────
  db:
    <<: *hardening
    container_name: vtssg_inv02_db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-vtssg_inv}
      POSTGRES_USER: ${DB_USERNAME:-vtssg_inv}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: Europe/Berlin
    secrets: [db_password]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes: [pgdata:/var/lib/postgresql/data]
    tmpfs: ["/tmp", "/run/postgresql"]
    read_only: true
    networks: [backend]
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Cache / Queue ──────────────────────────────────────────────────
  redis:
    <<: *hardening
    container_name: vtssg_inv02_redis
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --save 300 10 --maxmemory 256mb --maxmemory-policy noeviction"]
    secrets: [redis_password]
    cap_add: [CHOWN, SETUID, SETGID]
    volumes: [redisdata:/data]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ── Anwendung (PHP-FPM) – führt Migrationen aus ────────────────────
  app:
    <<: *app
    container_name: vtssg_inv02_app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "true"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 768m

  # ── Queue-Worker (E-Mails, Benachrichtigungen) ─────────────────────
  queue:
    <<: *app
    container_name: vtssg_inv02_queue
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=192"]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f \"artisan queue:work\" >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 384m

  # ── Scheduler (Prüf-Erinnerungen, Audit-Verifikation) ──────────────
  scheduler:
    <<: *app
    container_name: vtssg_inv02_scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app: { condition: service_healthy }
    healthcheck: { disable: true }
    mem_limit: 256m

  # ── Web / TLS (Caddy) ──────────────────────────────────────────────
  web:
    <<: *hardening
    container_name: vtssg_inv02_web
    image: vtssg_inv02_web:${APP_VERSION:-latest}
    build: { context: ., target: web }
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      CADDY_TLS: ${CADDY_TLS:-}
      CADDY_GLOBAL: ${CADDY_GLOBAL:-}
    ports:
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-80}:80"
      - "${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp"]
    networks: [frontend]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  # ── Verschlüsselte Backups ─────────────────────────────────────────
  backup:
    <<: *hardening
    container_name: vtssg_inv02_backup
    image: vtssg_inv02_backup:${APP_VERSION:-latest}
    build: { context: ., dockerfile: docker/backup/Dockerfile }
    environment:
      DB_HOST: vtssg_inv02_db
      DB_DATABASE: ${DB_DATABASE:-vtssg_inv}
      DB_USERNAME: ${DB_USERNAME:-vtssg_inv}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
    secrets: [db_password, backup_passphrase]
    group_add: ["82"]   # www-data: Lesezugriff auf storage
    volumes:
      - backups:/backups
      - storage:/data:ro
    read_only: true
    tmpfs: ["/tmp:size=2g"]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m

  # ── Entwicklung: Mail-Catcher (nur mit --profile dev) ──────────────
  mailpit:
    <<: *hardening
    container_name: vtssg_inv02_mailpit
    image: axllent/mailpit:latest
    profiles: [dev]
    ports: ["127.0.0.1:8025:8025"]
    networks: [frontend]

networks:
  frontend:
    name: vtssg_inv02_frontend
  backend:
    name: vtssg_inv02_backend
    internal: true   # kein Zugriff nach außen: DB und Redis sind vom Internet abgeschottet

volumes:
  pgdata: { name: vtssg_inv02_pgdata }
  redisdata: { name: vtssg_inv02_redisdata }
  storage: { name: vtssg_inv02_storage }
  backups: { name: vtssg_inv02_backups }
  caddy_data: { name: vtssg_inv02_caddy_data }
  caddy_config: { name: vtssg_inv02_caddy_config }

secrets:
  app_key: { file: ./secrets/app_key }
  db_password: { file: ./secrets/db_password }
  redis_password: { file: ./secrets/redis_password }
  admin_password: { file: ./secrets/admin_password }
  backup_passphrase: { file: ./secrets/backup_passphrase }
