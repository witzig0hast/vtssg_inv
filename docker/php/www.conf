[global]
daemonize = no
error_log = /proc/self/fd/2
pid = /tmp/php-fpm.pid

[www]
listen = 9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /status
ping.path = /ping
ping.response = pong

; Pool-Härtung: keine Shell-/Prozess-Funktionen im Web-Kontext, Dateizugriff nur in der App
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,show_source,highlight_file,phpinfo,dl
php_admin_value[open_basedir] = /var/www/html:/tmp:/usr/share/zoneinfo:/etc/ssl/certs:/etc/resolv.conf:/etc/hosts
php_admin_value[sys_temp_dir] = /tmp
php_admin_value[upload_tmp_dir] = /tmp
